name: Build Server Control (EXE and APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows ServerAgent.exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project archive
        run: tar -xf ServerControl_Project.zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          cd agent
          pyinstaller --onefile --clean --name "ServerAgent" server_agent.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerAgent-Windows
          path: agent/dist/ServerAgent.exe

  build-android:
    name: Build Android ServerControl.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project archive
        run: unzip -o ServerControl_Project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Build APK
        run: |
          cd mobile
          rm -rf android
          flutter create --org com.servercontrol --platforms=android --project-name server_control .
          python3 -c "
          p = 'lib/screens/console_screen.dart'
          c = open(p).read()
          c = c.replace('const Icons.refresh,', 'const Icon(Icons.refresh),')
          c = c.replace('const Icons.copy,', 'const Icon(Icons.copy),')
          open(p, 'w').write(c)

          m = 'android/app/src/main/AndroidManifest.xml'
          content = open(m).read()
          content = content.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application android:usesCleartextTraffic=\"true\"')
          open(m, 'w').write(content)
          "
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ServerControl.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerControl-Android-APK
          path: mobile/build/app/outputs/flutter-apk/ServerControl.apk

  publish-release:
    name: Publish Release with EXE and APK
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ServerAgent-Windows
          path: ./release-files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: ServerControl-Android-APK
          path: ./release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ServerControl v1.0.0 (Готовые файлы)"
          body: |
            Готовые файлы для управления сервером:
            * ServerAgent.exe (Windows)
            * ServerControl.apk (Android)
          files: |
            ./release-files/**/ServerAgent.exe
            ./release-files/**/ServerControl.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
